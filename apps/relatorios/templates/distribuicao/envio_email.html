{% extends "relatorios/base_relatorios.html" %}
{% block title %}Enviar Relatório por E-mail · VistoGEST{% endblock %}
{% block content %}<div class="page-head"><div><h1>Enviar relatório por e-mail</h1><p>Seleccione um relatório gerado por si e indique o destinatário.</p></div></div><form method="post" class="panel"><div class="panel-body">{% csrf_token %}<div class="field"><label for="relatorio_id">ID do relatório gerado</label><input id="relatorio_id" name="relatorio_id" type="number" min="1" required></div><div class="field"><label for="email">E-mail do destinatário</label><input id="email" name="email" type="email" required></div><p><button class="btn primary" type="submit">Enviar</button></p></div></form>{% endblock %}
