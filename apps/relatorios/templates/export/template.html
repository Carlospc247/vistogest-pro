<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><title>{{ title|default:"Relatório" }}</title><style>body{font:12px Arial,sans-serif;color:#172033}h1{font-size:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccd4df;padding:7px;text-align:left}th{background:#eaf0f8}</style></head><body><h1>{{ title|default:"Relatório VistoGEST" }}</h1>{% if dados %}<table><thead><tr>{% for key, value in dados.0.items %}<th>{{ key }}</th>{% endfor %}</tr></thead><tbody>{% for row in dados %}<tr>{% for key, value in row.items %}<td>{{ value }}</td>{% endfor %}</tr>{% endfor %}</tbody></table>{% else %}<p>Não existem dados para exportar.</p>{% endif %}</body></html>
