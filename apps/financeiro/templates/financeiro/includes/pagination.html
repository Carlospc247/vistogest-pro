{% if is_paginated %}<div class="pagination"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div class="actions">{% if page_obj.has_previous %}<a class="btn secondary" href="?page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn secondary" href="?page={{ page_obj.next_page_number }}">Seguinte</a>{% endif %}</div></div>{% endif %}
