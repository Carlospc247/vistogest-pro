{# financeiro/cartao/_nav.html — navegação + filtros (estilos partilhados) #}
<style>
  .fin-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .fin-table th,.fin-table td{padding:.5rem .6rem;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}
  .fin-table th{font-size:.75rem;text-transform:uppercase;color:#6b7280}
  .fin-table .num{text-align:right}
  .fin-vazio{text-align:center;color:#6b7280;padding:1.5rem}
  .fin-badge{font-size:.72rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;background:#f3f4f6;color:#374151}
  .fin-aprovado{background:#dcfce7;color:#166534}.fin-estornado,.fin-rejeitado,.fin-cancelado{background:#fee2e2;color:#991b1b}
  .fin-pendente,.fin-processando{background:#fef3c7;color:#92400e}
  .fin-filtro{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;margin:1rem 0}
  .fin-filtro label{display:flex;flex-direction:column;font-size:.75rem;color:#6b7280;gap:.2rem}
  .fin-filtro input,.fin-filtro select{padding:.4rem .5rem;border:1px solid #d1d5db;border-radius:6px}
  .fin-cancel{display:flex;gap:.3rem}.fin-cancel input{padding:.25rem .4rem;border:1px solid #d1d5db;border-radius:6px;width:9rem}
  .fin-pag{display:flex;gap:1rem;align-items:center;justify-content:center;margin-top:1rem}
</style>
<nav class="link-grid" style="margin-bottom:1rem">
  <a class="link-card" href="{% url 'financeiro:cartao_lista' %}"><strong>Visão geral</strong></a>
  <a class="link-card" href="{% url 'financeiro:vendas_cartao' %}"><strong>Vendas</strong></a>
  <a class="link-card" href="{% url 'financeiro:recebimentos_cartao' %}"><strong>Recebimentos</strong></a>
  <a class="link-card" href="{% url 'financeiro:taxas_cartao' %}"><strong>Taxas</strong></a>
  <a class="link-card" href="{% url 'financeiro:conciliacao_cartao' %}"><strong>Conciliação</strong></a>
  <a class="link-card" href="{% url 'financeiro:tef' %}"><strong>Terminal TEF</strong></a>
  <a class="link-card" href="{% url 'financeiro:tef_transacoes' %}"><strong>Transações TEF</strong></a>
</nav>
{% if filtro %}
<form method="get" class="fin-filtro">
  <label>De<input type="date" name="inicio" value="{{ inicio|date:'Y-m-d' }}"></label>
  <label>Até<input type="date" name="fim" value="{{ fim|date:'Y-m-d' }}"></label>
  {% if estados %}
  <label>Estado
    <select name="estado"><option value="">Todos</option>
      {% for cod, rotulo in estados %}<option value="{{ cod }}" {% if estado == cod %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  {% if com_busca %}<label>Pesquisar<input type="search" name="q" value="{{ busca }}" placeholder="NSU, TID, autorização, documento"></label>{% endif %}
  <button type="submit" class="btn">Filtrar</button>
</form>
{% endif %}
