<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ config.nome_exibicao }} — Em construção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center text-center" style="min-height:100vh">
  <div class="p-4">
    <i class="fas fa-tools fa-3x mb-3" style="color:{{ config.cor_primaria|default:'#1E40AF' }}"></i>
    <h1 class="fw-bold">{{ config.nome_exibicao }}</h1>
    <p class="lead text-muted">O nosso site está em construção. Volte em breve!</p>
    {% if config.numero_whatsapp %}
    <a href="https://wa.me/{{ config.numero_whatsapp }}" class="btn btn-success rounded-pill mt-2"><i class="fab fa-whatsapp me-2"></i>Falar no WhatsApp</a>
    {% endif %}
  </div>
</body>
</html>
