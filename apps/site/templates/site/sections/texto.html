<!--texto.html-->
<section class="py-5">
  <div class="container text-{% if dados.alinhamento == 'centro' %}center{% elif dados.alinhamento == 'direita' %}end{% else %}start{% endif %}">
    {% if dados.titulo %}<h2 class="fw-bold mb-3">{{ dados.titulo }}</h2>{% endif %}
    {% if dados.conteudo %}
        <div class="texto-conteudo">
            {{ dados.conteudo|safe }}
        </div>
    {% elif dados.conteudo_html %}
        <div class="texto-conteudo">
            {{ dados.conteudo_html|safe }}
        </div>
    {% endif %}
  </div>
</section>
