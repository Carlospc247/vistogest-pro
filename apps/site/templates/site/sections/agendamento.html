<!-- agendamento.html -->
 <section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="fw-bold">{{ dados.titulo }}</h2>
      <p class="text-muted">{{ dados.subtitulo }}</p>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-6 bg-white p-4 shadow-lg rounded-3">
        {# corrigido: o nome da rota é 'site:agendamento' #}
        <form id="formAgendamento-{{ secao.id }}" action="{% url 'site:agendamento' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3"><label class="small fw-bold">O seu nome</label><input type="text" name="nome" class="form-control" required></div>
          <div class="row">
            <div class="col-md-6 mb-3"><label class="small fw-bold">WhatsApp</label><input type="tel" name="telefone" class="form-control" placeholder="244..." required></div>
            <div class="col-md-6 mb-3"><label class="small fw-bold">Email</label><input type="email" name="email" class="form-control" required></div>
          </div>
          <div class="mb-3">
            <label class="small fw-bold">Serviço</label>
            <select name="servico_id" class="form-select" required>
              {% for s in servicos_disponiveis %}
              <option value="{{ s.id }}">{{ s.nome }}{% if dados.mostrar_preco %} — {{ s.preco }} {{ config.moeda }}{% endif %}</option>
              {% empty %}<option value="">Sem serviços disponíveis</option>{% endfor %}
            </select>
          </div>
          <div class="mb-4"><label class="small fw-bold">Data e hora preferencial</label><input type="datetime-local" name="data_hora" class="form-control" required></div>
          <div class="msg-agendamento mb-3" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" style="background-color:{{ dados.cor_botao|default:'#6366f1' }};border-color:{{ dados.cor_botao|default:'#6366f1' }}">Confirmar marcação</button>
        </form>
      </div>
    </div>
  </div>
</section>
<script>
(function () {
  const f = document.getElementById('formAgendamento-{{ secao.id }}');
  if (!f) return;
  const msg = f.querySelector('.msg-agendamento');
  const dt = f.querySelector('[name=data_hora]');
  dt.min = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      const r = await fetch(f.action, {method: 'POST', body: new FormData(f)});
      const j = await r.json();
      if (!j.success) throw new Error(j.error || 'Erro');
      msg.className = 'msg-agendamento mb-3 alert alert-success';
      msg.textContent = '{{ dados.mensagem_sucesso|default:"Agendamento realizado! Aguarde a nossa confirmação."|escapejs }}';
      f.reset();
    } catch (err) {
      msg.className = 'msg-agendamento mb-3 alert alert-danger';
      msg.textContent = 'Não foi possível agendar. Verifique os dados e tente novamente.';
    }
    btn.disabled = false;
  });
})();
</script>
