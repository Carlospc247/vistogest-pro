<!--servicos.html-->
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center fw-bold mb-4">{{ dados.titulo }}</h2>
    <div class="row g-4">
      {% for s in secao.itens_vitrine %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="fw-bold">{{ s.nome }}</h5>
            <p class="text-muted small">{{ s.descricao|truncatewords:25 }}</p>
            <p class="text-primary fw-bold mb-3">{{ s.preco }} {{ config.moeda }}</p>
            <div class="mt-auto d-grid gap-2">
              <a href="{% url 'site:servico_detalhe' s.id %}" class="btn btn-outline-secondary btn-sm">Ver detalhes</a>
              <button type="button" class="btn btn-primary btn-sm" onclick="addCarrinho('servico', {{ s.id }}, this)">Contratar</button>
            </div>
          </div>
        </div>
      </div>
      {% empty %}
      <p class="text-center text-muted">Sem serviços disponíveis de momento.</p>
      {% endfor %}
    </div>
  </div>
</section>
