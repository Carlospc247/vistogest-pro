<section style="padding:clamp(2.5rem,5vw,4.5rem) 1.25rem">
  <style>
    #site-video-{{ secao.pk }}{width:min(100%,1120px);margin:auto}
    #site-video-{{ secao.pk }} .site-video-frame{position:relative;width:100%;height:{{ dados.altura_px|default:450 }}px;max-height:75vh;min-height:240px;overflow:hidden;border-radius:16px;background:#0f172a;box-shadow:0 12px 36px rgba(15,23,42,.14)}
    #site-video-{{ secao.pk }} iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  </style>
  <div id="site-video-{{ secao.pk }}">
    {% if dados.titulo %}<h2 style="font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;text-align:center;margin:0 0 1.5rem">{{ dados.titulo }}</h2>{% endif %}
    {% if dados.url_video %}
      <div class="site-video-frame"><iframe src="{{ dados.url_video }}" title="{{ dados.titulo|default:'Vídeo incorporado' }}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    {% elif modo_preview %}<p style="padding:2rem;text-align:center;border:1px dashed #cbd5e1;border-radius:12px;color:#64748b">Insere um URL de incorporação (embed) do vídeo no editor.</p>{% endif %}
  </div>
</section>
