<section class="site-image-block" style="padding:clamp(2rem,5vw,5rem) 1.25rem;background:var(--fundo-seccao,#fff)">
  <style>
    #site-imagem-{{ secao.pk }}{width:min(100%,{% if dados.largura_total %}1320px{% else %}980px{% endif %});margin:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(1.25rem,4vw,3rem);align-items:center}
    #site-imagem-{{ secao.pk }} img{display:block;width:100%;max-height:620px;object-fit:cover;border-radius:var(--raio-bordas,16px);box-shadow:0 12px 34px rgba(15,23,42,.12)}
    #site-imagem-{{ secao.pk }} .site-image-caption{font-size:.95rem;line-height:1.8;color:var(--cor-texto,#475569)}
    @media(max-width:760px){#site-imagem-{{ secao.pk }}{grid-template-columns:1fr}}
  </style>
  <div id="site-imagem-{{ secao.pk }}">
    {% if dados.imagem_url %}<img src="{{ dados.imagem_url }}" alt="{{ dados.legenda|default:'Imagem ilustrativa' }}" loading="lazy">
    {% elif modo_preview %}<div style="min-height:220px;border:2px dashed #cbd5e1;border-radius:14px;display:grid;place-items:center;color:#64748b;padding:2rem">Adiciona um URL de imagem no editor.</div>{% endif %}
    {% if dados.legenda %}<div class="site-image-caption">{{ dados.legenda }}</div>{% endif %}
  </div>
</section>
