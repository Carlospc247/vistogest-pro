{% if is_paginated %}<nav class="mt-5 flex items-center justify-between text-sm"><span class="text-gray-500">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div class="flex gap-2">{% if page_obj.has_previous %}<a class="rounded-lg border px-3 py-2" href="?{% if request.GET %}{{ request.GET.urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="rounded-lg border px-3 py-2" href="?{% if request.GET %}{{ request.GET.urlencode }}&{% endif %}page={{ page_obj.next_page_number }}">Seguinte</a>{% endif %}</div></nav>{% endif %}
