{% if page_obj and page_obj.paginator.num_pages > 1 %}
<div class="pagination">
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registo(s)</span>
  <div class="actions">
    {% if page_obj.has_previous %}<a class="btn btn-light btn-small" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}">Anterior</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-light btn-small" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}">Seguinte</a>{% endif %}
  </div>
</div>
{% endif %}
