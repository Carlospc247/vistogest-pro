{% extends "funcionarios/_rh_base.html" %}
{% block title %}Calcular folha{% endblock %}
{% block rh_content %}
<div class="max-w-md mx-auto rh-card">
  <h1 class="text-xl font-bold mb-4">Calcular folha de pagamento</h1>
  <form method="post" class="space-y-4">{% csrf_token %}
    <div><label class="text-sm block mb-1">Mês</label><select name="mes" class="rh-input" id="mes">
      {% for n,nome in "1,Janeiro;2,Fevereiro;3,Março;4,Abril;5,Maio;6,Junho;7,Julho;8,Agosto;9,Setembro;10,Outubro;11,Novembro;12,Dezembro"|make_list %}{% endfor %}
    </select></div>
    <div><label class="text-sm block mb-1">Ano</label><input type="number" name="ano" id="ano" class="rh-input" min="2020" max="2050"></div>
    <button class="rh-btn rh-btn-p w-full">Calcular</button>
  </form>
</div>
<script>
const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje=new Date(); document.getElementById('mes').innerHTML=nomes.map((n,i)=>`<option value="${i+1}" ${i===hoje.getMonth()?'selected':''}>${n}</option>`).join('');
document.getElementById('ano').value=hoje.getFullYear();
</script>
{% endblock %}
