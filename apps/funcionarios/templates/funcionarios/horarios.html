{% extends "funcionarios/_rh_base.html" %}
{% block title %}Horários{% endblock %}
{% block rh_content %}
<h1 class="text-2xl font-bold mb-4">Horários por dia</h1>
<div class="rh-card mb-4 flex gap-3 items-end"><div><label class="text-xs rh-muted block">Data</label><input type="date" id="dia" class="rh-input"></div><button id="ver" class="rh-btn rh-btn-p">Consultar</button></div>
<div class="rh-card p-0 overflow-x-auto"><table class="rh-table"><thead><tr><th>Funcionário</th><th>Turno</th><th>Entrada</th><th>Saída</th></tr></thead><tbody id="corpo"><tr><td colspan="4" class="text-center py-6 rh-muted">Escolha uma data.</td></tr></tbody></table></div>
<script>
const dia=document.getElementById('dia'); dia.value=new Date().toISOString().slice(0,10);
async function carregar(){
  const r=await fetch("{% url 'funcionarios:api_horarios_disponiveis' %}?data="+dia.value); const d=await r.json();
  const c=document.getElementById('corpo'); const l=d.horarios||[];
  c.innerHTML=l.length?l.map(h=>`<tr><td>${h.funcionario}</td><td>${h.turno}</td><td>${h.entrada}</td><td>${h.saida}</td></tr>`).join(''):'<tr><td colspan="4" class="text-center py-6 rh-muted">Sem escalas neste dia.</td></tr>';
}
document.getElementById('ver').onclick=carregar; carregar();
</script>
{% endblock %}
