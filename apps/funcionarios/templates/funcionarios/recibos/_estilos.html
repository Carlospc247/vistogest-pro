{# recibos/_estilos.html #}
<style>
  .rv-doc{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px;max-width:900px;margin:0 auto;padding:20px;border:1px solid #e5e7eb;border-radius:8px}

  .rv-doc h2{font-size:13px;margin:12px 0 4px}
