{# funcionarios/importar.html #}
{% extends "funcionarios/_rh_base.html" %}
{% block title %}Importar funcionários{% endblock %}
{% block rh_content %}
<div class="max-w-lg mx-auto rh-card"><h1 class="text-xl font-bold mb-2">Importar funcionários</h1>
  <div class="p-3 mb-3 rounded bg-yellow-50 text-yellow-800 text-sm">A <code>ImportarFuncionariosView</code> só tem GET: falta o método <code>post()</code> para processar o ficheiro.</div>
  <form method="post" enctype="multipart/form-data" class="space-y-3">{% csrf_token %}<input type="file" name="arquivo" accept=".csv" class="rh-input"><button class="rh-btn rh-btn-p">Importar CSV</button></form></div>
{% endblock %}
