{% extends "base.html" %}
{% block extra_css %}{{ block.super }}
<style>
  .ig-card{background:#fff;border:1px solid #f3f4f6;border-radius:.75rem;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:1.25rem}
  .ig-btn{display:inline-block;padding:.4rem .85rem;border:1px solid #d1d5db;border-radius:.375rem;background:#fff;font-size:.85rem;color:#374151;cursor:pointer}
  .ig-btn:hover{background:#f9fafb}.ig-btn-p{background:#4f46e5;color:#fff;border-color:#4f46e5}.ig-btn-p:hover{background:#4338ca}
  .ig-btn-ok{background:#16a34a;color:#fff;border-color:#16a34a}.ig-btn-d{background:#dc2626;color:#fff;border-color:#dc2626}
  .ig-table{width:100%;font-size:.85rem}.ig-table th{background:#f9fafb;color:#6b7280;text-align:left;padding:.6rem .75rem;font-weight:500}
  .ig-table td{padding:.6rem .75rem;border-top:1px solid #f3f4f6;vertical-align:top}
  .ig-badge{display:inline-block;padding:.1rem .6rem;border-radius:9999px;font-size:.72rem;background:#f3f4f6;color:#374151;white-space:nowrap}
  .ig-ok{background:#dcfce7;color:#166534}.ig-warn{background:#fef3c7;color:#92400e}.ig-bad{background:#fee2e2;color:#991b1b}
  .ig-muted{color:#6b7280}.ig-ico{width:2.6rem;height:2.6rem;border-radius:.6rem;background:#eef2ff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .ig-input,.ig-campo input:not([type=checkbox]),.ig-campo select,.ig-campo textarea{width:100%;border:1px solid #d1d5db;border-radius:.375rem;padding:.5rem .75rem;background:#fff}
  .ig-pre{background:#0f172a;color:#e2e8f0;border-radius:.5rem;padding:.8rem;font-size:.78rem;overflow:auto;max-height:22rem;white-space:pre-wrap;word-break:break-word}
  .ig-alert{padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem}
  .ig-bar{height:.5rem;background:#f3f4f6;border-radius:9999px;overflow:hidden}.ig-bar>div{height:100%;background:#6366f1}
</style>
{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-7xl">
  <nav class="flex flex-wrap gap-2 mb-6">
    <a class="ig-btn" href="{% url 'integracoes:dashboard' %}"><i class="fas fa-plug mr-1"></i> Painel</a>
    <a class="ig-btn" href="{% url 'integracoes:log_lista' %}"><i class="fas fa-stream mr-1"></i> Logs</a>
    <a class="ig-btn" href="{% url 'integracoes:webhook_lista' %}"><i class="fas fa-satellite-dish mr-1"></i> Webhooks</a>
    <a class="ig-btn" href="{% url 'integracoes:guia' %}"><i class="fas fa-book mr-1"></i> Guia</a>
  </nav>
  {% block ig_content %}{% endblock %}
</div>
{% endblock %}
